[workspace]
members  = [
    "programs/collateral-manager",
    "programs/lending-vault",
    "programs/trading-engine",
    "programs/settlement",
]
resolver = "2"

[workspace.metadata.solana]
tools-version = "v1.54"

[profile.release]
overflow-checks = true
lto             = "fat"
codegen-units   = 1

[profile.release.build-override]
opt-level     = 3
incremental   = false
codegen-units = 1

